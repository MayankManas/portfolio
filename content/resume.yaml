# ------------------------------------------------------------------------------
# projects
# A `slug` is what creates a deep case study page. It requires a matching
# content/projects/<slug>.md — the build fails if either side is missing.
# No slug => the project renders as a card only.
#
# NOTE: ApplyPilot is deliberately absent. It is a third-party tool the user
# uses to search and apply for jobs, NOT his project. Do not add it.
# ------------------------------------------------------------------------------
projects:
  - name: FileServer
    blurb: >-
      Secure HTTPS file server for LAN environments — streaming I/O for files up
      to 100 GB, path-traversal defense, IP whitelisting and structured logging.
    stack: [TypeScript, Node.js, Express, Jest]
    slug: fileserver              # flagship — has a case study
    highlights:
      - Streams files up to 100 GB without buffering
      - HTTP Basic Auth with bcrypt, RFC1918 IP whitelist, rate limiting
      - Winston structured JSON logging with rotation; jest + supertest coverage
    # No links block on purpose - the repo stays unadvertised for now. The case
    # study at /projects/fileserver is driven by `slug`, not by links, so it is
    # unaffected. To publish the repo later, restore BOTH lines together:
    #   links:
    #     repo: https://github.com/<user>/FileServer
    # A bare `links:` with nothing under it fails the build - YAML reads it as null.

